name: Signal tools smoke test

on:
  push:
    paths:
      - "launcher.py"
      - "tools/**"
      - ".github/workflows/signal-tools-smoke.yml"
  pull_request:
    paths:
      - "launcher.py"
      - "tools/**"
      - ".github/workflows/signal-tools-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax
        run: python -m py_compile launcher.py tools/signal_cli.py tools/signal_group_scrape.py tools/signal_group_invite.py
      - name: Launcher help
        run: python launcher.py --help
